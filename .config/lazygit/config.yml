git:
  overrideGpg: true
gui:
  authorColors:
    "*": magenta
  showNumstatInFilesView: true
  skipRewordInEditorWarning: true
  theme:
    activeBorderColor:
      - "#205EA6"
      - bold
    inactiveBorderColor:
      - "#CECDC3"
    selectedLineBgColor:
      - "#E6E4D9" # Light cream background for readable text in light mode
    optionsTextColor:
      - "#6F6E69"
keybinding:
  files:
    viewResetOptions: <disabled>
