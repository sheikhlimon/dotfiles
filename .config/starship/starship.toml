add_newline = true
scan_timeout = 100
continuation_prompt = "[▸▹ ](dimmed dark)"

format = """
$os\
$directory\
($container$fill$git_metrics\n)$cmd_duration\
$character"""

right_format = """
$docker_context\
$git_branch\
$git_commit\
$git_state\
$git_status\
$c\
$cpp\
$cmake\
$rust\
$golang\
$nodejs\
$bun\
$deno\
$python\
$lua\
$zig\
$java\
$kotlin\
$php\
$ruby\
$swift\
$memory_usage\
$aws\
$custom"""

# -----------------------------------------------------------------------------
# Core UI Elements
# -----------------------------------------------------------------------------

[cmd_duration]
format = "[󰪢 $duration ](dark)"

[fill]
symbol = " "

[directory]
home_symbol = " "
read_only = " "
truncation_length = 3
truncation_symbol = "••/"

[directory.substitutions]
"Desktop"   = " "
"Documents" = " "
"Downloads" = " "
"Music"     = "󰎈 "
"Pictures"  = " "
"Videos"    = " "
"GitHub"    = "󰊤 "

[os]
format = '$symbol'
disabled = false

[os.symbols]
Linux = "  "

# -----------------------------------------------------------------------------
# Git & Version Control
# -----------------------------------------------------------------------------

[git_branch]
format = '\[[$symbol$branch]($style)\]'
symbol = " "

[git_commit]
tag_symbol = "  "

[git_status]
format     = '(\[[$all_status]($style)\])'
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[git_metrics]
format = '([\[▴$added\]]($added_style))([\[▿$deleted\]]($deleted_style))'
added_style = "dimmed green"
deleted_style = "dimmed red"
ignore_submodules = true
disabled = false

# -----------------------------------------------------------------------------
# Containers & System
# -----------------------------------------------------------------------------

[docker_context]
format = '\[[$symbol$context]($style)\]'
symbol = " "

[memory_usage]
format = '\[[$symbol$project]($style)\]'
symbol = "󰍛 "

[nix_shell]
format = '\[[$symbol$state( \($name\))]($style)\]'
symbol = " "

# -----------------------------------------------------------------------------
# Languages & Runtimes
# -----------------------------------------------------------------------------

[c]
format = '\[[$symbol($version(-$name))]($style)\]'
symbol = " "

[cpp]
format = '\[[$symbol($version(-$name))]($style)\]'
symbol = " "

[cmake]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[meson]
format = '\[[$symbol$project]($style)\]'
symbol = "󰔷 "

[rust]
format = '\[[$symbol($version)]($style)\]'
symbol = "󱘗 "

[golang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
symbol = " "

[nodejs]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[bun]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[deno]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[lua]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[zig]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[java]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[kotlin]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[gradle]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[php]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[ruby]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[swift]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[dart]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

# -----------------------------------------------------------------------------
# Cloud & Integrations
# -----------------------------------------------------------------------------

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
symbol = "  "

[gcloud]
disabled = true

[package]
disabled = true
